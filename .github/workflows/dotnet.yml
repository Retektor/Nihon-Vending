# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:

    runs-on: ubuntu-latest

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore NihonVending
      
    - name: Build
      run: dotnet build NihonVending --no-restore 

    - name: Start database container
      run: docker compose up -d db
      
    - name: Wait for database
      run: |
        for i in {1..30}; do
          if docker compose exec -T db pg_isready -U postgres -d nihon-vending; then
            echo "Database is ready"
            exit 0
          fi

          echo "Waiting for database..."
          sleep 2
        done

        echo "Database did not become ready"
        docker compose logs db
        exit 1
        
    - name: Project integrity test
      run: dotnet test NihonVending --no-build --verbosity normal
      
    - name: Unit testing
      run: dotnet test NihonVending.Tests --no-build --configuration Release

    - name: Stop database container
      if: always()
      run: docker compose down --volumes --remove-orphans
